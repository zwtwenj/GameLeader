version: '1.0'
name: deploy
displayName: 构建部署
triggers:
  push:
    branches:
      include:
        - master

stages:
  - name: deploy-stage
    displayName: 部署到服务器
    steps:
      - step: shell@agent
        name: ssh-deploy
        displayName: SSH 触发服务器重建
        inputs:
          script: |
            # 依赖：Gitee 流水线环境变量（仓库设置 → 环境变量）：
            #   SSH_HOST / SSH_USER / SSH_PASSWORD
            # 服务器需已安装 Docker Compose，且 /opt/gameleader 下有代码与 backend/.env.production
            apt-get update -qq && apt-get install -y -qq sshpass >/dev/null 2>&1 || true
            sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s << 'REMOTE'
              set -e
              cd /opt/gameleader
              git pull origin master
              docker compose up -d --build
              docker image prune -f
REMOTE
            echo "部署完成"
