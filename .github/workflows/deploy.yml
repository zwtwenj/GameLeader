# 部署流水线：push 到 master 时 SSH 到目标服务器执行 git pull + compose 重建。
# 依赖仓库 Settings → Secrets and variables → Actions 配置：
#   SSH_HOST / SSH_USER / SSH_PASSWORD
# 服务器需已就绪：Docker Compose、/opt/gameleader 代码、
# backend/.env.production 与 .env（compose 插值用，含 MYSQL_* 变量）
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 触发服务器重建
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s << 'REMOTE'
            set -e
            cd /opt/gameleader
            git pull origin master
            docker compose up -d --build
            docker image prune -f
          REMOTE
          echo 部署完成
